# Skip file-based labeling if more than 100 files changed
max-files-changed: 100

adapter:
  - changed-files:
      - any-glob-to-any-file:
          - "src/noc/sa/profiles/**"
collections:
  - changed-files:
      - any-glob-to-any-file:
          - "collections/**"
c-fm:
  - changed-files:
      - any-glob-to-any-file:
          - "collections/fm.*/**"
c-inv:
  - changed-files:
      - any-glob-to-any-file:
          - "collections/inv.*/**"
c-pm:
  - changed-files:
      - any-glob-to-any-file:
          - "collections/pm.*/**"
c-sa:
  - changed-files:
      - any-glob-to-any-file:
          - "collections/sa.*/**"
c-other:
  - changed-files:
      - any-glob-to-any-file:
          - "collections/bi.dashboardlayouts/**"
          - "collections/bi.dashboards/**"
          - "collections/cm.configurationparams/**"
          - "collections/cm.configurationscopes/**"
          - "collections/cm.errortypes/**"
          - "collections/dev.quiz/**"
          - "collections/dev.specs/**"
          - "collections/gis.layers/**"
          - "collections/main.glyphs/**"
          - "collections/main.handlers/**"
          - "collections/main.labels/**"
          - "collections/main.modeltemplates/**"
          - "collections/main.reports/**"
          - "collections/main.templates/**"
          - "collections/sa.actioncommands/**"
          - "collections/sa.actions/**"
          - "collections/wf.states/**"
          - "collections/wf.transitions/**"
          - "collections/wf.workflows/**"
core:
  - changed-files:
      - any-glob-to-any-file:
          - "src/noc/core/**"
deploy:
  - changed-files:
      - any-glob-to-any-file:
          - "ansible/**"
docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "mkdocs.yml"
github:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
migrations:
  - changed-files:
      - any-glob-to-any-file:
          - "src/noc/*/migrations/*.py"
setup:
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
s-discovery:
  - changed-files:
      - any-glob-to-any-file:
          - "src/noc/services/bh/**"
          - "src/noc/services/discovery/**"
s-fm:
  - changed-files:
      - any-glob-to-any-file:
          - "src/noc/services/classifier/**"
          - "src/noc/services/correlator/**"
          - "src/noc/services/syslogcollector/**"
          - "src/noc/services/trapcollector/**"
          - "src/noc/services/ping/**"
          - "src/noc/services/escalator/**"
          - "src/noc/services/mib/**"
s-integration:
  - changed-files:
      - any-glob-to-any-file:
          - "src/noc/services/datastream/**"
          - "src/noc/services/nbi/**"
          - "src/noc/services/kafkasender/**"
          - "src/noc/services/mailsender/**"
          - "src/noc/services/mx/**"
          - "src/noc/services/tgsender/**"
s-pm:
  - changed-files:
      - any-glob-to-any-file:
          - "src/noc/services/metrics/**"
          - "src/noc/services/metricscollector/**"
s-sa:
  - changed-files:
      - any-glob-to-any-file:
          - "src/noc/services/activator/**"
          - "src/noc/services/runner/**"
          - "src/noc/services/mrt/**"
          - "src/noc/services/sae/**"
s-web:
  - changed-files:
      - any-glob-to-any-file:
          - "src/noc/services/web/**"
          - "src/noc/services/ui/**"
          - "src/noc/services/card/**"
          - "src/noc/services/login/**"
s-other:
  - changed-files:
      - any-glob-to-any-file:
          - "src/noc/services/bi/**"
          - "src/noc/services/chwriter/**"
          - "src/noc/services/grafanads/**"
          - "src/noc/services/scheduler/**"
          - "src/noc/services/selfmon/**"
          - "src/noc/services/topo/**"
          - "src/noc/services/worker/**"
tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
ui:
  - changed-files:
      - any-glob-to-any-file:
          - "ui/**"
