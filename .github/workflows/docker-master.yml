name: Docker Image Build
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: # allows manual trigger
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: # ref - git rep, tag - docker image tag
          - ref: master
            tag: 26-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true
          use: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check image
        id: check
        env:
          IMAGE: ghcr.io/gufolabs/noc:${{ matrix.tag }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

          BUILT_COMMIT=$(
            docker buildx imagetools inspect "$IMAGE" --raw 2>/dev/null |
            jq -r '.annotations["org.opencontainers.image.revision"] // empty'
          ) || true

          echo "Commit:       $COMMIT"
          echo "Built commit: ${BUILT_COMMIT:-<none>}"

          if [ "$COMMIT" = "$BUILT_COMMIT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Image is up to date"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Image needs to be built"
          fi

      - name: Build and push image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/gufolabs/noc:${{ matrix.tag }}
          target: code
          annotations: |
            index:org.opencontainers.image.revision=${{ steps.check.outputs.commit }}
